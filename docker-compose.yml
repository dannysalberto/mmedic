services:
  postgres:
    image: postgres:16-alpine
    container_name: mmedic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmedic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmedic_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-mmedic_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmedic} -d ${POSTGRES_DB:-mmedic_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: mmedic-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
