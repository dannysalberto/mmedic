<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="favMedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="favRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo circular oscuro estilizado -->
  <rect width="100" height="100" rx="22" fill="#0F172A" />

  <!-- Isotipo Centrado -->
  <g transform="translate(0, 0)">
    <!-- Anillo orbital -->
    <path d="M 50 14 A 36 36 0 1 1 20 30" fill="none" stroke="url(#favRingGrad)" stroke-width="6.5" stroke-linecap="round"/>
    
    <!-- Nodo de confirmación -->
    <circle cx="20" cy="30" r="5" fill="#10B981" filter="url(#glow)" />

    <!-- Cruz médica estilizada -->
    <rect x="44" y="30" width="12" height="40" rx="4" fill="url(#favMedGrad)" filter="url(#glow)" />
    <rect x="30" y="44" width="40" height="12" rx="4" fill="url(#favMedGrad)" filter="url(#glow)" />
  </g>
</svg>
