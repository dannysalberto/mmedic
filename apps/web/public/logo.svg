<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 435 96" width="100%" height="100%">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>

  <!-- ISOTIPO -->
  <g transform="translate(10, 10)">
    <!-- Anillo de ciclo administrativo / flujo de espera -->
    <path d="M 50 10 A 40 40 0 1 1 18 28" fill="none" stroke="url(#ringGrad)" stroke-width="6.5" stroke-linecap="round"/>
    
    <!-- Nodo de transacción / confirmación -->
    <circle cx="18" cy="28" r="5" fill="#10B981" />

    <!-- Cruz médica central estilizada -->
    <rect x="43" y="30" width="14" height="40" rx="4" fill="url(#medGrad)" />
    <rect x="30" y="43" width="40" height="14" rx="4" fill="url(#medGrad)" />
  </g>

  <!-- LOGOTIPO / TIPOGRAFÍA -->
  <text x="120" y="57" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">
    Med<tspan fill="#00D2FF">Flow</tspan><tspan fill="#10B981">.</tspan>
  </text>
  <text x="120" y="80" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#94A3B8" letter-spacing="1.2">
    GESTIÓN CLÍNICA &amp; FACTURACIÓN
  </text>
</svg>


