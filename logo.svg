<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="120">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- ISOTIPO -->
  <g transform="translate(10, 10)">
    <!-- Anillo de ciclo administrativo / flujo de espera -->
    <path d="M 50 10 A 40 40 0 1 1 18 28" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Nodo de transacción / confirmación -->
    <circle cx="18" cy="28" r="4.5" fill="#10B981" />

    <!-- Cruz médica central estilizada -->
    <rect x="44" y="32" width="12" height="36" rx="4" fill="url(#medGrad)" />
    <rect x="32" y="44" width="36" height="12" rx="4" fill="url(#medGrad)" />
  </g>

  <!-- LOGOTIPO / TIPOGRAFÍA -->
  <text x="125" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#0F172A">
    Med<tspan fill="#0EA5E9">Flow</tspan><tspan fill="#10B981">.</tspan>
  </text>
  <text x="127" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2">
    GESTIÓN CLÍNICA &amp; FACTURACIÓN
  </text>
</svg>
